<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Reactive Morphing Shapes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Inter", sans-serif;
            overflow: hidden;
            background: #040307;
            background-image:
                radial-gradient(circle at 50% 35%, #1d1431 0%, transparent 65%),
                linear-gradient(180deg, #000000 0%, #070012 100%);
            color: #eee;
        }
        #container {
            position: fixed;
            inset: 0;
        }
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 65%, rgba(0,0,0,.5) 100%);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .instructions {
            position: fixed;
            left: 24px;
            bottom: 24px;
            transform: none;
            padding: 10px 20px;
            font-size: 12px;
            text-align: left;
            pointer-events: none;
            color: #d0b0ff;
            background: rgba(18, 15, 40, 0.25);
            border: 1px solid rgba(122, 70, 255, 0.28);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,.45);
        }

        .controls {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(230, 220, 255, 0.9);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            backdrop-filter: blur(10px) saturate(180%);
            -webkit-backdrop-filter: blur(10px) saturate(180%);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.05);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.45);
            color: white;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn.active {
            background: rgba(180, 0, 255, 0.3);
            border-color: rgba(180, 0, 255, 0.5);
        }

        #fileInput {
            display: none;
        }

        .file-label {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            color: rgba(230, 220, 255, 0.9);
            background: linear-gradient(135deg, rgba(17, 153, 142, 0.3) 0%, rgba(56, 239, 125, 0.3) 100%);
            border: 1px solid rgba(56, 239, 125, 0.4);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .file-label:hover {
            background: linear-gradient(135deg, rgba(17, 153, 142, 0.5) 0%, rgba(56, 239, 125, 0.5) 100%);
            transform: scale(1.05);
        }

        #status {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 13px;
            color: #d0b0ff;
            background: rgba(18, 15, 40, 0.25);
            border: 1px solid rgba(122, 70, 255, 0.28);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,.45);
        }

        .audio-meter {
            position: fixed;
            right: 24px;
            bottom: 24px;
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 80px;
            padding: 10px;
            background: rgba(18, 15, 40, 0.25);
            border: 1px solid rgba(122, 70, 255, 0.28);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .meter-bar {
            width: 8px;
            background: linear-gradient(to top, #ff3c78, #ff8c00, #fff200);
            border-radius: 4px;
            transition: height 0.05s ease;
        }

        /* UI Toggle */
        .ui-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(18, 15, 40, 0.4);
            border: 1px solid rgba(122, 70, 255, 0.28);
            backdrop-filter: blur(12px);
            cursor: pointer;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #d0b0ff;
            transition: all 0.3s ease;
        }

        .ui-toggle:hover {
            background: rgba(122, 70, 255, 0.3);
            transform: scale(1.1);
        }

        .ui-toggle.hidden-ui {
            opacity: 0.5;
        }

        /* Hide UI elements */
        .ui-hidden .instructions,
        .ui-hidden .controls,
        .ui-hidden .audio-meter,
        .ui-hidden #status {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .instructions,
        .controls,
        .audio-meter,
        #status {
            transition: opacity 0.3s ease;
        }
    </style>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
      }
    }
    </script>
</head>
<body>
    <div id="container"></div>
    <div class="vignette"></div>

    <button class="ui-toggle" id="uiToggle" title="Toggle UI">&#9881;</button>

    <div class="instructions">Drag to explore<br>Audio drives the visuals</div>

    <div id="status">Choose an audio file or use microphone</div>

    <div class="controls">
        <input type="file" id="fileInput" accept="audio/*">
        <label for="fileInput" class="file-label">Load Audio</label>
        <button id="micBtn" class="btn">Microphone</button>
        <button id="playBtn" class="btn" disabled>Play</button>
        <button id="morphBtn" class="btn">Morph</button>
        <button id="autoCamBtn" class="btn">Auto Cam</button>
    </div>

    <div class="audio-meter">
        <div class="meter-bar" id="bar1"></div>
        <div class="meter-bar" id="bar2"></div>
        <div class="meter-bar" id="bar3"></div>
        <div class="meter-bar" id="bar4"></div>
        <div class="meter-bar" id="bar5"></div>
        <div class="meter-bar" id="bar6"></div>
        <div class="meter-bar" id="bar7"></div>
        <div class="meter-bar" id="bar8"></div>
    </div>

    <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { AfterimagePass } from "three/addons/postprocessing/AfterimagePass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    // Audio variables
    let audioContext, analyser, source, audioElement;
    let isPlaying = false, isMicActive = false;
    const frequencyData = new Uint8Array(256);
    let bassLevel = 0, midLevel = 0, highLevel = 0, overallLevel = 0;

    // Three.js variables
    const PARTICLE_COUNT = 15000;
    const SPARK_COUNT = 2000;
    const STAR_COUNT = 7000;

    let scene, camera, renderer, composer, controls, bloomPass, afterimagePass;
    let particles, sparkles, stars;
    let clock = new THREE.Clock();
    let currentPattern = 0, isTrans = false, prog = 0;
    const morphSpeed = 0.03;

    // Audio-reactive parameters - CRANKED UP for dramatic response
    let audioScale = 1;
    let audioIntensity = 0;
    let beatDetected = false;
    let lastBeatTime = 0;
    let beatThreshold = 0.35; // Much lower threshold for more morphs

    // Sensitivity multipliers - toned down to prevent blowout
    const SENSITIVITY = 2.0;        // Overall sensitivity boost
    const BASS_MULT = 2.5;          // Bass impact multiplier
    const MID_MULT = 2.0;           // Mid impact multiplier
    const HIGH_MULT = 1.8;          // High impact multiplier

    // DOM elements
    const fileInput = document.getElementById('fileInput');
    const micBtn = document.getElementById('micBtn');
    const playBtn = document.getElementById('playBtn');
    const morphBtn = document.getElementById('morphBtn');
    const autoCamBtn = document.getElementById('autoCamBtn');
    const uiToggle = document.getElementById('uiToggle');
    const status = document.getElementById('status');

    // Auto camera state
    let autoCamEnabled = false;
    let autoCamTime = 0;

    // Morph timing - slower with hold
    let lastMorphCompleteTime = 0;
    const MORPH_HOLD_TIME = 3000; // 3 seconds minimum hold

    // UI toggle
    uiToggle.addEventListener('click', () => {
        document.body.classList.toggle('ui-hidden');
        uiToggle.classList.toggle('hidden-ui');
        uiToggle.innerHTML = document.body.classList.contains('ui-hidden') ? '&#9728;' : '&#9881;';
    });
    const meterBars = [
        document.getElementById('bar1'),
        document.getElementById('bar2'),
        document.getElementById('bar3'),
        document.getElementById('bar4'),
        document.getElementById('bar5'),
        document.getElementById('bar6'),
        document.getElementById('bar7'),
        document.getElementById('bar8')
    ];

    // Pattern generation functions
    function normalise(points, size) {
        if (points.length === 0) return [];
        const box = new THREE.Box3().setFromPoints(points);
        const maxDim = Math.max(...box.getSize(new THREE.Vector3()).toArray()) || 1;
        const centre = box.getCenter(new THREE.Vector3());
        return points.map(p => p.clone().sub(centre).multiplyScalar(size / maxDim));
    }

    function torusKnot(n) {
        const geometry = new THREE.TorusKnotGeometry(10, 3, 200, 16, 2, 3);
        const points = [];
        const positionAttribute = geometry.attributes.position;
        for (let i = 0; i < positionAttribute.count; i++) {
            points.push(new THREE.Vector3().fromBufferAttribute(positionAttribute, i));
        }
        const result = [];
        for (let i = 0; i < n; i++) {
            result.push(points[i % points.length].clone());
        }
        return normalise(result, 50);
    }

    function halvorsen(n) {
        const pts = [];
        let x = 0.1, y = 0, z = 0;
        const a = 1.89;
        const dt = 0.005;
        for (let i = 0; i < n * 25; i++) {
            const dx = -a * x - 4 * y - 4 * z - y * y;
            const dy = -a * y - 4 * z - 4 * x - z * z;
            const dz = -a * z - 4 * x - 4 * y - x * x;
            x += dx * dt;
            y += dy * dt;
            z += dz * dt;
            if (i > 200 && i % 25 === 0) {
                pts.push(new THREE.Vector3(x, y, z));
            }
            if (pts.length >= n) break;
        }
        while(pts.length < n) pts.push(pts[Math.floor(Math.random()*pts.length)].clone());
        return normalise(pts, 60);
    }

    function dualHelix(n) {
        const pts = [];
        const turns = 5;
        const radius = 15;
        const height = 40;
        for (let i = 0; i < n; i++) {
            const isSecondHelix = i % 2 === 0;
            const angle = (i / n) * Math.PI * 2 * turns;
            const y = (i / n) * height - height / 2;
            const r = radius + (isSecondHelix ? 5 : -5);
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 60);
    }

    function deJong(n) {
        const pts = [];
        let x = 0.1, y = 0.1;
        const a = 1.4, b = -2.3, c = 2.4, d = -2.1;
        for (let i = 0; i < n; i++) {
            const xn = Math.sin(a * y) - Math.cos(b * x);
            const yn = Math.sin(c * x) - Math.cos(d * y);
            x = xn;
            y = yn;
            const z = Math.sin(x * y * 0.5);
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 55);
    }

    // Lorenz attractor - classic butterfly
    function lorenz(n) {
        const pts = [];
        let x = 0.1, y = 0, z = 0;
        const sigma = 10, rho = 28, beta = 8/3;
        const dt = 0.005;
        for (let i = 0; i < n * 20; i++) {
            const dx = sigma * (y - x);
            const dy = x * (rho - z) - y;
            const dz = x * y - beta * z;
            x += dx * dt;
            y += dy * dt;
            z += dz * dt;
            if (i > 100 && i % 20 === 0) {
                pts.push(new THREE.Vector3(x, y, z));
            }
            if (pts.length >= n) break;
        }
        while(pts.length < n) pts.push(pts[Math.floor(Math.random()*pts.length)].clone());
        return normalise(pts, 55);
    }

    // Aizawa attractor - organic blob
    function aizawa(n) {
        const pts = [];
        let x = 0.1, y = 0, z = 0;
        const a = 0.95, b = 0.7, c = 0.6, d = 3.5, e = 0.25, f = 0.1;
        const dt = 0.01;
        for (let i = 0; i < n * 15; i++) {
            const dx = (z - b) * x - d * y;
            const dy = d * x + (z - b) * y;
            const dz = c + a * z - (z * z * z) / 3 - (x * x + y * y) * (1 + e * z) + f * z * x * x * x;
            x += dx * dt;
            y += dy * dt;
            z += dz * dt;
            if (i > 100 && i % 15 === 0) {
                pts.push(new THREE.Vector3(x, y, z));
            }
            if (pts.length >= n) break;
        }
        while(pts.length < n) pts.push(pts[Math.floor(Math.random()*pts.length)].clone());
        return normalise(pts, 55);
    }

    // Thomas attractor - flowing curves
    function thomas(n) {
        const pts = [];
        let x = 0.1, y = 0, z = 0;
        const b = 0.208186;
        const dt = 0.05;
        for (let i = 0; i < n * 10; i++) {
            const dx = Math.sin(y) - b * x;
            const dy = Math.sin(z) - b * y;
            const dz = Math.sin(x) - b * z;
            x += dx * dt;
            y += dy * dt;
            z += dz * dt;
            if (i > 50 && i % 10 === 0) {
                pts.push(new THREE.Vector3(x, y, z));
            }
            if (pts.length >= n) break;
        }
        while(pts.length < n) pts.push(pts[Math.floor(Math.random()*pts.length)].clone());
        return normalise(pts, 55);
    }

    // Clifford attractor - 2D made 3D
    function clifford(n) {
        const pts = [];
        let x = 0.1, y = 0.1;
        const a = -1.4, b = 1.6, c = 1.0, d = 0.7;
        for (let i = 0; i < n; i++) {
            const xn = Math.sin(a * y) + c * Math.cos(a * x);
            const yn = Math.sin(b * x) + d * Math.cos(b * y);
            x = xn;
            y = yn;
            const z = Math.sin(x + y) * Math.cos(x * y * 0.5);
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 55);
    }

    // Rossler attractor - twisted band
    function rossler(n) {
        const pts = [];
        let x = 0.1, y = 0, z = 0;
        const a = 0.2, b = 0.2, c = 5.7;
        const dt = 0.02;
        for (let i = 0; i < n * 12; i++) {
            const dx = -y - z;
            const dy = x + a * y;
            const dz = b + z * (x - c);
            x += dx * dt;
            y += dy * dt;
            z += dz * dt;
            if (i > 100 && i % 12 === 0) {
                pts.push(new THREE.Vector3(x, y, z));
            }
            if (pts.length >= n) break;
        }
        while(pts.length < n) pts.push(pts[Math.floor(Math.random()*pts.length)].clone());
        return normalise(pts, 55);
    }

    // Sphere with noise
    function noisySphere(n) {
        const pts = [];
        for (let i = 0; i < n; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 20 + Math.sin(theta * 8) * 3 + Math.cos(phi * 6) * 3;
            const x = r * Math.sin(phi) * Math.cos(theta);
            const y = r * Math.sin(phi) * Math.sin(theta);
            const z = r * Math.cos(phi);
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 55);
    }

    // Spiral galaxy
    function spiralGalaxy(n) {
        const pts = [];
        const arms = 3;
        for (let i = 0; i < n; i++) {
            const arm = i % arms;
            const t = (i / n) * 4;
            const armAngle = (arm / arms) * Math.PI * 2;
            const angle = t * Math.PI * 2 + armAngle;
            const r = t * 12 + Math.random() * 5;
            const x = Math.cos(angle) * r + (Math.random() - 0.5) * t * 3;
            const z = Math.sin(angle) * r + (Math.random() - 0.5) * t * 3;
            const y = (Math.random() - 0.5) * 3 * (1 + t * 0.5);
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 60);
    }

    // Heart shape
    function heart(n) {
        const pts = [];
        for (let i = 0; i < n; i++) {
            const t = (i / n) * Math.PI * 2;
            const u = Math.random() * Math.PI * 2;
            const v = Math.random() * Math.PI;
            // Heart surface parametric
            const x = 16 * Math.pow(Math.sin(t), 3) * Math.sin(v) * Math.cos(u);
            const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * Math.sin(v);
            const z = 16 * Math.pow(Math.sin(t), 3) * Math.sin(v) * Math.sin(u);
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 55);
    }

    // Mobius strip
    function mobius(n) {
        const pts = [];
        for (let i = 0; i < n; i++) {
            const u = (i / n) * Math.PI * 2;
            const v = (Math.random() - 0.5) * 2;
            const x = (1 + v / 2 * Math.cos(u / 2)) * Math.cos(u) * 15;
            const y = (1 + v / 2 * Math.cos(u / 2)) * Math.sin(u) * 15;
            const z = v / 2 * Math.sin(u / 2) * 15;
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 55);
    }

    // Trefoil knot
    function trefoil(n) {
        const pts = [];
        for (let i = 0; i < n; i++) {
            const t = (i / n) * Math.PI * 2;
            const r = Math.random() * 3;
            const theta = Math.random() * Math.PI * 2;
            const x = (Math.sin(t) + 2 * Math.sin(2 * t)) * 10 + r * Math.cos(theta);
            const y = (Math.cos(t) - 2 * Math.cos(2 * t)) * 10 + r * Math.sin(theta);
            const z = -Math.sin(3 * t) * 10 + r * Math.sin(theta);
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 55);
    }

    // Figure 8 / Lemniscate in 3D
    function lemniscate(n) {
        const pts = [];
        for (let i = 0; i < n; i++) {
            const t = (i / n) * Math.PI * 2;
            const a = 20;
            const r = Math.random() * 4;
            const phi = Math.random() * Math.PI * 2;
            const x = a * Math.cos(t) / (1 + Math.sin(t) * Math.sin(t)) + r * Math.cos(phi) * 0.3;
            const y = a * Math.sin(t) * Math.cos(t) / (1 + Math.sin(t) * Math.sin(t)) + r * Math.sin(phi) * 0.3;
            const z = a * 0.3 * Math.sin(2 * t) + r * Math.sin(phi) * 0.3;
            pts.push(new THREE.Vector3(x, y, z));
        }
        return normalise(pts, 55);
    }

    const PATTERNS = [
        torusKnot, halvorsen, dualHelix, deJong,
        lorenz, aizawa, thomas, clifford,
        rossler, noisySphere, spiralGalaxy, heart,
        mobius, trefoil, lemniscate
    ];

    function createStars() {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(STAR_COUNT * 3);
        const col = new Float32Array(STAR_COUNT * 3);
        const size = new Float32Array(STAR_COUNT);
        const rnd = new Float32Array(STAR_COUNT);
        const R = 900;

        for (let i = 0; i < STAR_COUNT; i++) {
            const i3 = i * 3;
            const θ = Math.random() * 2 * Math.PI;
            const φ = Math.acos(2 * Math.random() - 1);
            const r = R * Math.cbrt(Math.random());
            pos[i3] = r * Math.sin(φ) * Math.cos(θ);
            pos[i3 + 1] = r * Math.sin(φ) * Math.sin(θ);
            pos[i3 + 2] = r * Math.cos(φ);
            const c = new THREE.Color().setHSL(Math.random() * 0.6, 0.3 + 0.3 * Math.random(), 0.55 + 0.35 * Math.random());
            col[i3] = c.r;
            col[i3 + 1] = c.g;
            col[i3 + 2] = c.b;
            size[i] = 0.25 + Math.pow(Math.random(), 4) * 2.1;
            rnd[i] = Math.random() * Math.PI * 2;
        }

        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
        geo.setAttribute("size", new THREE.BufferAttribute(size, 1));
        geo.setAttribute("random", new THREE.BufferAttribute(rnd, 1));

        const mat = new THREE.ShaderMaterial({
            uniforms: { time: { value: 0 }, audioLevel: { value: 0 } },
            vertexShader: `
                attribute float size;
                attribute float random;
                uniform float audioLevel;
                varying vec3 vColor;
                varying float vRnd;
                varying float vAudio;
                void main() {
                    vColor = color;
                    vRnd = random;
                    vAudio = audioLevel;
                    vec4 mv = modelViewMatrix * vec4(position, 1.);
                    // Stars pulse with audio - subtle
                    float audioSize = 1.0 + audioLevel * 1.0;
                    gl_PointSize = size * audioSize * (250. / -mv.z);
                    gl_Position = projectionMatrix * mv;
                }`,
            fragmentShader: `
                uniform float time;
                uniform float audioLevel;
                varying vec3 vColor;
                varying float vRnd;
                varying float vAudio;
                void main() {
                    vec2 uv = gl_PointCoord - 0.5;
                    float d = length(uv);
                    float a = 1.0 - smoothstep(0.4, 0.5, d);
                    // Faster twinkle with audio
                    float twinkleSpeed = 0.6 + vAudio * 3.0;
                    a *= 0.5 + 0.5 * sin(time * twinkleSpeed + vRnd * 5.);
                    a *= 0.6 + vAudio * 0.6; // Subtle brightness with audio
                    if (a < 0.02) discard;
                    // Slight color shift with audio
                    vec3 col = mix(vColor, vec3(1.0), vAudio * 0.2);
                    gl_FragColor = vec4(col, min(a, 1.0));
                }`,
            transparent: true,
            depthWrite: false,
            vertexColors: true,
            blending: THREE.AdditiveBlending
        });

        return new THREE.Points(geo, mat);
    }

    function makeParticles(count, palette) {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        const size = new Float32Array(count);
        const rnd = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
            const i3 = i * 3;
            const base = palette[Math.random() * palette.length | 0];
            const hsl = { h: 0, s: 0, l: 0 };
            base.getHSL(hsl);
            hsl.h += (Math.random() - 0.5) * 0.05;
            hsl.s = Math.min(1, Math.max(0.7, hsl.s + (Math.random() - 0.5) * 0.3));
            hsl.l = Math.min(0.9, Math.max(0.5, hsl.l + (Math.random() - 0.5) * 0.4));
            const c = new THREE.Color().setHSL(hsl.h, hsl.s, hsl.l);
            col[i3] = c.r;
            col[i3 + 1] = c.g;
            col[i3 + 2] = c.b;
            size[i] = 0.7 + Math.random() * 1.1;
            rnd[i3] = Math.random() * 10;
            rnd[i3 + 1] = Math.random() * Math.PI * 2;
            rnd[i3 + 2] = 0.5 + 0.5 * Math.random();
        }

        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
        geo.setAttribute("size", new THREE.BufferAttribute(size, 1));
        geo.setAttribute("random", new THREE.BufferAttribute(rnd, 3));

        const mat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                hueSpeed: { value: 0.12 },
                audioScale: { value: 1.0 },
                bassLevel: { value: 0.0 },
                midLevel: { value: 0.0 },
                highLevel: { value: 0.0 }
            },
            vertexShader: `
                uniform float time;
                uniform float audioScale;
                uniform float bassLevel;
                uniform float midLevel;
                attribute float size;
                attribute vec3 random;
                varying vec3 vCol;
                varying float vR;
                varying float vBass;
                void main() {
                    vCol = color;
                    vR = random.z;
                    vBass = bassLevel;

                    // DRAMATIC scale pulsing with audio
                    float dramaticScale = audioScale * (1.0 + bassLevel * 0.5);
                    vec3 p = position * dramaticScale;

                    // Faster, more reactive time
                    float t = time * (0.4 + midLevel * 0.8) * random.z;
                    float ax = t + random.y, ay = t * 0.75 + random.x;

                    // Audio amplitude - reactive but controlled
                    float audioAmp = 1.0 + bassLevel * 4.0 + midLevel * 2.5;
                    float amp = (0.8 + sin(random.x + t * 0.6) * 0.4) * random.z * audioAmp;

                    // Wave displacement
                    p.x += sin(ax + p.y * 0.08 + random.x * 0.2) * amp;
                    p.y += cos(ay + p.z * 0.08 + random.y * 0.2) * amp;
                    p.z += sin(ax * 0.85 + p.x * 0.08 + random.z * 0.2) * amp;

                    // Explosion on bass hits - reduced
                    float explosion = bassLevel * bassLevel * 8.0;
                    p += normalize(position) * explosion * random.z;

                    vec4 mv = modelViewMatrix * vec4(p, 1.);

                    // Size pulsing - reduced
                    float pulse = 0.9 + 0.2 * sin(time * 2.0 + random.y);
                    float audioSize = 1.0 + bassLevel * 0.8 + midLevel * 0.4;
                    gl_PointSize = size * pulse * audioSize * (300. / -mv.z);
                    gl_Position = projectionMatrix * mv;
                }`,
            fragmentShader: `
                uniform float time;
                uniform float hueSpeed;
                uniform float highLevel;
                uniform float bassLevel;
                uniform float midLevel;
                varying vec3 vCol;
                varying float vR;
                varying float vBass;

                vec3 hueShift(vec3 c, float h) {
                    const vec3 k = vec3(0.57735);
                    float cosA = cos(h);
                    float sinA = sin(h);
                    return c * cosA + cross(k, c) * sinA + k * dot(k, c) * (1.0 - cosA);
                }

                void main() {
                    vec2 uv = gl_PointCoord - 0.5;
                    float d = length(uv);

                    float core = smoothstep(0.05, 0.0, d);
                    float angle = atan(uv.y, uv.x);

                    // More dramatic flare animation driven by audio
                    float flareSpeed = 2.0 + highLevel * 8.0;
                    float flare = pow(max(0.0, sin(angle * 6.0 + time * flareSpeed * vR)), 3.0);
                    flare *= smoothstep(0.5, 0.0, d);
                    flare *= 1.0 + highLevel * 2.0; // Flares intensify with highs

                    float glow = smoothstep(0.4, 0.1, d);
                    glow *= 1.0 + midLevel * 1.5; // Glow pulses with mids

                    // Controlled brightness - not too intense
                    float alpha = core * 0.8 + flare * 0.4 + glow * 0.25;
                    alpha *= 0.7 + highLevel * 0.3 + bassLevel * 0.2;

                    // Hue cycling - faster with more audio
                    float hueAmount = hueSpeed + highLevel * 1.5 + bassLevel * 1.0;
                    vec3 color = hueShift(vCol, time * hueAmount);

                    // Subtle flash on bass hits - much less white
                    float flash = bassLevel * bassLevel * 0.15;
                    color = mix(color, vec3(1.0, 0.95, 0.9), flash);

                    // Keep saturation vibrant
                    float sat = 1.0 + midLevel * 0.3;
                    color = mix(vec3(dot(color, vec3(0.299, 0.587, 0.114))), color, sat);

                    vec3 finalColor = mix(color, vec3(1.0, 0.95, 0.9), core);
                    finalColor = mix(finalColor, color, flare * 0.5 + glow * 0.5);

                    if (alpha < 0.01) discard;

                    gl_FragColor = vec4(finalColor, min(alpha, 1.0));
                }`,
            transparent: true,
            depthWrite: false,
            vertexColors: true,
            blending: THREE.AdditiveBlending
        });

        return new THREE.Points(geo, mat);
    }

    function createSparkles(count) {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        const size = new Float32Array(count);
        const rnd = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
            size[i] = 0.5 + Math.random() * 0.8;
            rnd[i * 3] = Math.random() * 10;
            rnd[i * 3 + 1] = Math.random() * Math.PI * 2;
            rnd[i * 3 + 2] = 0.5 + 0.5 * Math.random();
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(size, 1));
        geo.setAttribute('random', new THREE.BufferAttribute(rnd, 3));

        const mat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                audioScale: { value: 1.0 },
                bassLevel: { value: 0.0 }
            },
            vertexShader: `
                uniform float time;
                uniform float audioScale;
                uniform float bassLevel;
                attribute float size;
                attribute vec3 random;
                varying float vBass;
                void main() {
                    vBass = bassLevel;
                    float dramaticScale = audioScale * (1.0 + bassLevel * 0.5);
                    vec3 p = position * dramaticScale;
                    float t = time * (0.4 + bassLevel * 0.8) * random.z;
                    float ax = t + random.y, ay = t * 0.75 + random.x;
                    float audioAmp = 1.0 + bassLevel * 4.0;
                    float amp = (0.8 + sin(random.x + t * 0.6) * 0.4) * random.z * audioAmp;
                    p.x += sin(ax + p.y * 0.08 + random.x * 0.2) * amp;
                    p.y += cos(ay + p.z * 0.08 + random.y * 0.2) * amp;
                    p.z += sin(ax * 0.85 + p.x * 0.08 + random.z * 0.2) * amp;
                    // Explosion effect - reduced
                    float explosion = bassLevel * bassLevel * 8.0;
                    p += normalize(position) * explosion * random.z;
                    vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
                    float audioSize = 1.0 + bassLevel * 1.0;
                    gl_PointSize = size * audioSize * (250.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }`,
            fragmentShader: `
                uniform float time;
                varying float vBass;
                void main() {
                    float d = length(gl_PointCoord - vec2(0.5));
                    float alpha = 1.0 - smoothstep(0.3, 0.5, d);
                    alpha *= 0.5 + vBass * 0.4; // More subtle brightness
                    if (alpha < 0.01) discard;
                    // Slight color tint on bass
                    vec3 col = mix(vec3(0.9, 0.9, 1.0), vec3(1.0, 0.95, 0.9), vBass * 0.3);
                    gl_FragColor = vec4(col, min(alpha, 0.8));
                }`,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        return new THREE.Points(geo, mat);
    }

    // Audio functions
    function initAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 512;
            analyser.smoothingTimeConstant = 0.4; // Lower = faster response, more reactive
            analyser.minDecibels = -90; // Capture quieter sounds
            analyser.maxDecibels = -10;
        }
    }

    function analyzeAudio() {
        if (!analyser) return;

        analyser.getByteFrequencyData(frequencyData);

        // Calculate frequency bands
        const bassEnd = Math.floor(frequencyData.length * 0.1);
        const midEnd = Math.floor(frequencyData.length * 0.5);

        let bassSum = 0, midSum = 0, highSum = 0;

        for (let i = 0; i < frequencyData.length; i++) {
            if (i < bassEnd) {
                bassSum += frequencyData[i];
            } else if (i < midEnd) {
                midSum += frequencyData[i];
            } else {
                highSum += frequencyData[i];
            }
        }

        // Raw levels (0-1)
        let rawBass = (bassSum / bassEnd) / 255;
        let rawMid = (midSum / (midEnd - bassEnd)) / 255;
        let rawHigh = (highSum / (frequencyData.length - midEnd)) / 255;

        // Apply power curve to exaggerate - sqrt makes small values bigger
        // Then multiply for dramatic effect
        bassLevel = Math.min(1, Math.pow(rawBass, 0.6) * BASS_MULT);
        midLevel = Math.min(1, Math.pow(rawMid, 0.6) * MID_MULT);
        highLevel = Math.min(1, Math.pow(rawHigh, 0.6) * HIGH_MULT);
        overallLevel = Math.min(1, (bassLevel + midLevel + highLevel) / 3 * SENSITIVITY);

        // Beat detection - slowed down by 60%
        const now = performance.now();
        const timeSinceLastMorph = now - lastMorphCompleteTime;
        const canMorph = timeSinceLastMorph > MORPH_HOLD_TIME; // 3 second minimum hold

        if (rawBass > beatThreshold && now - lastBeatTime > 400) { // Slower (was 150ms)
            beatDetected = true;
            lastBeatTime = now;
            // Auto-morph on beats - only if hold time passed
            if (rawBass > 0.5 && !isTrans && canMorph) { // Higher threshold (was 0.3)
                beginMorph();
            }
        } else {
            beatDetected = false;
        }

        // Update audio-reactive parameters - DRAMATIC scaling
        audioScale = 1 + bassLevel * 0.6; // Was 0.15, now 0.6
        audioIntensity = overallLevel;

        // Update meter bars
        const bandSize = Math.floor(frequencyData.length / 8);
        for (let i = 0; i < 8; i++) {
            let sum = 0;
            for (let j = 0; j < bandSize; j++) {
                sum += frequencyData[i * bandSize + j];
            }
            const avg = Math.pow(sum / bandSize / 255, 0.6) * 2; // Exaggerated meters
            meterBars[i].style.height = Math.min(60, avg * 60) + 'px';
        }
    }

    // Audio event handlers
    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        initAudioContext();

        if (audioElement) {
            audioElement.pause();
            audioElement = null;
        }

        audioElement = new Audio();
        audioElement.src = URL.createObjectURL(file);

        audioElement.addEventListener('canplaythrough', () => {
            if (source) source.disconnect();
            source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            playBtn.disabled = false;
            status.textContent = `Loaded: ${file.name}`;
        });

        audioElement.addEventListener('ended', () => {
            isPlaying = false;
            playBtn.textContent = 'Play';
        });
    });

    micBtn.addEventListener('click', async () => {
        if (isMicActive) {
            if (source) {
                source.mediaStream.getTracks().forEach(track => track.stop());
                source.disconnect();
            }
            isMicActive = false;
            micBtn.textContent = 'Microphone';
            micBtn.classList.remove('active');
            status.textContent = 'Microphone stopped';
            return;
        }

        try {
            initAudioContext();

            if (audioElement) {
                audioElement.pause();
                isPlaying = false;
                playBtn.textContent = 'Play';
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

            if (source) source.disconnect();
            source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            isMicActive = true;
            micBtn.textContent = 'Stop Mic';
            micBtn.classList.add('active');
            status.textContent = 'Microphone active';
        } catch (err) {
            status.textContent = 'Microphone access denied';
            console.error('Microphone error:', err);
        }
    });

    playBtn.addEventListener('click', () => {
        if (!audioElement) return;

        if (audioContext.state === 'suspended') {
            audioContext.resume();
        }

        if (isPlaying) {
            audioElement.pause();
            isPlaying = false;
            playBtn.textContent = 'Play';
        } else {
            audioElement.play();
            isPlaying = true;
            playBtn.textContent = 'Pause';
        }
    });

    morphBtn.addEventListener('click', () => {
        if (!isTrans) {
            beginMorph();
        }
    });

    autoCamBtn.addEventListener('click', () => {
        autoCamEnabled = !autoCamEnabled;
        autoCamBtn.textContent = autoCamEnabled ? 'Stop Cam' : 'Auto Cam';
        autoCamBtn.classList.toggle('active', autoCamEnabled);
        if (autoCamEnabled) {
            autoCamTime = 0;
        }
    });

    // Three.js functions
    function init() {
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050203, 0.012);

        camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2500);
        camera.position.set(0, 0, 80);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(devicePixelRatio);
        renderer.setSize(innerWidth, innerHeight);
        document.getElementById("container").appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 20;
        controls.maxDistance = 200;
        controls.target.set(0, 0, 0);
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Gradient background sphere with color cycling
        const bgGeo = new THREE.SphereGeometry(1500, 32, 32);
        const bgMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                audioLevel: { value: 0 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPos.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform float audioLevel;
                varying vec3 vWorldPosition;

                // HSL to RGB conversion
                vec3 hsl2rgb(vec3 c) {
                    vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
                    return c.z + c.y * (rgb - 0.5) * (1.0 - abs(2.0 * c.z - 1.0));
                }

                void main() {
                    vec3 dir = normalize(vWorldPosition);
                    float y = dir.y * 0.5 + 0.5;

                    // Slowly cycling hue over time
                    float hueOffset = time * 0.02; // Very slow color cycle
                    float hueBase = mod(hueOffset, 1.0);

                    // Create 4 colors that cycle through hues
                    vec3 color1 = hsl2rgb(vec3(mod(hueBase + 0.0, 1.0), 0.6, 0.06));  // Top
                    vec3 color2 = hsl2rgb(vec3(mod(hueBase + 0.1, 1.0), 0.5, 0.10));
                    vec3 color3 = hsl2rgb(vec3(mod(hueBase + 0.2, 1.0), 0.4, 0.08));
                    vec3 color4 = hsl2rgb(vec3(mod(hueBase + 0.3, 1.0), 0.3, 0.02));  // Bottom

                    // Multi-stop gradient
                    vec3 col;
                    if (y < 0.3) {
                        col = mix(color4, color3, y / 0.3);
                    } else if (y < 0.6) {
                        col = mix(color3, color2, (y - 0.3) / 0.3);
                    } else {
                        col = mix(color2, color1, (y - 0.6) / 0.4);
                    }

                    // Aurora effect with color cycling
                    float aurora = sin(dir.x * 3.0 + time * 0.2) * sin(dir.z * 2.0 + time * 0.15);
                    aurora = aurora * 0.5 + 0.5;
                    aurora *= smoothstep(0.3, 0.7, y) * smoothstep(1.0, 0.7, y);
                    vec3 auroraColor = hsl2rgb(vec3(mod(hueBase + 0.5, 1.0), 0.7, 0.25));
                    col += auroraColor * aurora * 0.12 * (1.0 + audioLevel);

                    // Audio reactive pulse
                    col *= 1.0 + audioLevel * 0.25;

                    gl_FragColor = vec4(col, 1.0);
                }
            `,
            side: THREE.BackSide
        });
        const bgSphere = new THREE.Mesh(bgGeo, bgMat);
        bgSphere.name = 'background';
        scene.add(bgSphere);

        stars = createStars();
        scene.add(stars);

        const palette = [0xff3c78, 0xff8c00, 0xfff200, 0x00cfff, 0xb400ff, 0xffffff, 0xff4040].map(c => new THREE.Color(c));
        particles = makeParticles(PARTICLE_COUNT, palette);
        sparkles = createSparkles(SPARK_COUNT);
        scene.add(particles);
        scene.add(sparkles);

        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.5, 0.85);
        composer.addPass(bloomPass);
        afterimagePass = new AfterimagePass();
        afterimagePass.uniforms.damp.value = 0.88; // More trails
        composer.addPass(afterimagePass);
        composer.addPass(new OutputPass());

        applyPattern(currentPattern);

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
            composer.setSize(innerWidth, innerHeight);
        });
    }

    function applyPattern(i) {
        const pts = PATTERNS[i](PARTICLE_COUNT);
        const particleArr = particles.geometry.attributes.position.array;
        const sparkleArr = sparkles.geometry.attributes.position.array;
        for (let j = 0; j < PARTICLE_COUNT; j++) {
            const idx = j * 3;
            const p = pts[j] || new THREE.Vector3();
            particleArr[idx] = p.x;
            particleArr[idx + 1] = p.y;
            particleArr[idx + 2] = p.z;
            if (j < SPARK_COUNT) {
                sparkleArr[idx] = p.x;
                sparkleArr[idx + 1] = p.y;
                sparkleArr[idx + 2] = p.z;
            }
        }
        particles.geometry.attributes.position.needsUpdate = true;
        sparkles.geometry.attributes.position.needsUpdate = true;
    }

    function beginMorph() {
        isTrans = true;
        prog = 0;
        const next = (currentPattern + 1) % PATTERNS.length;
        const fromPts = particles.geometry.attributes.position.array.slice();
        const toPts = PATTERNS[next](PARTICLE_COUNT);

        const to = new Float32Array(PARTICLE_COUNT * 3);
        if (toPts.length > 0) {
            for (let j = 0; j < PARTICLE_COUNT; j++) {
                const idx = j * 3, p = toPts[j];
                to[idx] = p.x;
                to[idx + 1] = p.y;
                to[idx + 2] = p.z;
            }
            particles.userData = { from: fromPts, to, next };
            sparkles.userData = { from: fromPts, to, next };
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();
        const t = clock.getElapsedTime();

        // Analyze audio
        analyzeAudio();

        controls.update();

        // DRAMATIC audio-reactive rotation - spins faster with bass
        controls.autoRotateSpeed = 0.5 + bassLevel * 8;

        // Update uniforms with EXAGGERATED audio data
        particles.material.uniforms.time.value = t;
        particles.material.uniforms.audioScale.value = audioScale;
        particles.material.uniforms.bassLevel.value = bassLevel;
        particles.material.uniforms.midLevel.value = midLevel;
        particles.material.uniforms.highLevel.value = highLevel;

        sparkles.material.uniforms.time.value = t;
        sparkles.material.uniforms.audioScale.value = audioScale;
        sparkles.material.uniforms.bassLevel.value = bassLevel;

        stars.material.uniforms.time.value = t;
        stars.material.uniforms.audioLevel.value = overallLevel;

        // Update background gradient
        const bg = scene.getObjectByName('background');
        if (bg) {
            bg.material.uniforms.time.value = t;
            bg.material.uniforms.audioLevel.value = overallLevel;
        }

        // Bloom - subtle glow
        bloomPass.strength = Math.min(0.6, 0.15 + bassLevel * 0.3 + highLevel * 0.15);
        bloomPass.radius = 0.3 + bassLevel * 0.3;

        // Camera shake on big bass hits
        if (bassLevel > 0.7) {
            const shake = (bassLevel - 0.7) * 5;
            camera.position.x += (Math.random() - 0.5) * shake;
            camera.position.y += (Math.random() - 0.5) * shake;
        }

        // Dynamic FOV - zooms with bass for impact
        let baseFov = 60;
        if (autoCamEnabled) {
            autoCamTime += dt;
            // Smooth zoom in and out
            const zoomCycle = Math.sin(autoCamTime * 0.3) * 0.5 + 0.5; // 0-1
            const targetDist = 40 + zoomCycle * 100; // 40-140
            const currentDist = camera.position.length();
            const newDist = currentDist + (targetDist - currentDist) * 0.02;

            // Orbit around - vertical wave
            const orbitSpeed = 0.2;
            const verticalWave = Math.sin(autoCamTime * 0.15) * 30;
            const angle = autoCamTime * orbitSpeed;

            camera.position.x = Math.cos(angle) * newDist;
            camera.position.z = Math.sin(angle) * newDist;
            camera.position.y = verticalWave;
            camera.lookAt(0, 0, 0);

            // Vary FOV with zoom
            baseFov = 50 + (1 - zoomCycle) * 25;
        }
        camera.fov = baseFov + bassLevel * 15;
        camera.updateProjectionMatrix();

        // More motion blur/trails with audio
        afterimagePass.uniforms.damp.value = 0.88 + overallLevel * 0.08;

        if (isTrans) {
            prog += morphSpeed * 0.6; // 60% slower morph animation

            // Ease-in-out cubic for smooth acceleration and deceleration
            let eased;
            if (prog >= 1) {
                eased = 1;
            } else if (prog < 0.5) {
                eased = 4 * prog * prog * prog; // Ease in
            } else {
                eased = 1 - Math.pow(-2 * prog + 2, 3) / 2; // Ease out
            }

            const { from, to } = particles.userData;
            if (to) {
                const particleArr = particles.geometry.attributes.position.array;
                const sparkleArr = sparkles.geometry.attributes.position.array;
                for (let i = 0; i < particleArr.length; i++) {
                    const val = from[i] + (to[i] - from[i]) * eased;
                    particleArr[i] = val;
                    if (i < sparkleArr.length) {
                        sparkleArr[i] = val;
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
                sparkles.geometry.attributes.position.needsUpdate = true;
            }
            if (prog >= 1) {
                currentPattern = particles.userData.next;
                isTrans = false;
                lastMorphCompleteTime = performance.now(); // Track when morph completed
            }
        }

        composer.render(dt);
    }

    init();
    animate();
    </script>
</body>
</html>
