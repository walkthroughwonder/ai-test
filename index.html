<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>preview · Edwin Rosero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060607;
    --text-1: rgba(255,255,255,0.92);
    --text-2: rgba(255,255,255,0.50);
    --text-3: rgba(255,255,255,0.28);
    --line: rgba(255,255,255,0.09);
    --gold: #c8a44e;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text-1); }
  body { font-family: var(--serif); padding: 18vh 8vw 12vh; }
  .mark { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); margin: 0 0 2.4rem; }
  h1 { font-weight: 400; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.02em; margin: 0 0 0.4rem; }
  h1 em { font-style: italic; color: var(--gold); font-weight: 400; }
  .note { font-family: var(--mono); font-size: 12px; color: var(--text-3); margin: 0 0 3rem; }
  nav { display: flex; flex-direction: column; max-width: 28rem; border-top: 1px solid var(--line); }
  a { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding: 1.05rem 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  a:hover .name { color: var(--gold); }
  .name { font-size: 22px; }
  .kind { font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: 0.08em; }
</style>
</head>
<body>
  <p class="mark">Preview · not the live site</p>
  <h1>Edwin <em>Rosero</em></h1>
  <p class="note">Temporary. noindex. Homepage untouched.</p>
  <nav>
    <a href="preview/"><span class="name">Proof line</span><span class="kind">home</span></a>
    <a href="ledger/"><span class="name">Ledger</span><span class="kind">home</span></a>
    <a href="ritual/"><span class="name">Ritual</span><span class="kind">home</span></a>
    <a href="specimen/"><span class="name">Specimen</span><span class="kind">home</span></a>
  </nav>
</body>
</html>
